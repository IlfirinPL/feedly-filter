{% extends "base.html" %}
{% block content %}
<h1>Folders</h1>
<table>
  <tr><th>Folder</th></tr>
  {% for name in names %}
  <tr><td><a href="/folder?name={{ name | urlencode }}">{{ name }}</a></td></tr>
  {% else %}
  <tr><td class="muted">No folders yet</td></tr>
  {% endfor %}
</table>
{% endblock %}
