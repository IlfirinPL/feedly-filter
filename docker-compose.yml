services:
  feedly-filter:
    # Pulls the published image (tag from FEEDLY_FILTER_TAG, e.g. 0.1; default latest).
    # `docker compose up --build` builds it locally instead.
    image: ${FEEDLY_FILTER_IMAGE:-ghcr.io/ilfirinpl/feedly-filter}:${FEEDLY_FILTER_TAG:-latest}
    build: .
    ports:
      - "8080:8080"          # GUI, trusted network only (no authentication)
    volumes:
      - ./data:/data         # config.yaml, session.json, history.db
    environment:
      TZ: Europe/Warsaw
      DATA_DIR: /data
      PORT: "8080"
    restart: unless-stopped
